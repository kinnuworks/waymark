[project]
name = "waymark"
version = "0.1.0"
description = "Volunteer-mapped indoor guidance for blind and low-vision visitors, built on OpenCV 5"
requires-python = ">=3.12,<3.14"
dependencies = [
  "opencv-python-headless>=5.0.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waymark"]
